name: Development build and offline checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  development:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcrun --show-sdk-version
      - name: Check publishable source
        run: python3 scripts/check-source-hygiene.py
      - name: Run synthetic offline suites
        run: python3 scripts/diagnose-ci-tests.py
      - name: Preserve scoped synthetic test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: copystory-ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/copystory-ci-diagnostics/
          retention-days: 7
          if-no-files-found: error
      - name: Build and statically verify development candidate without launch
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          scripts/build-development.sh "$RUNNER_TEMP/copystory-development-candidate"
      # No runtime probe, GUI, clipboard, posting, permission, installation,
      # distribution credential or public release step. Only scoped synthetic
      # test diagnostics are uploaded; no app, store or raw crash report.
